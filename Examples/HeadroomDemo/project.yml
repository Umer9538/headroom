name: HeadroomDemo

options:
  bundleIdPrefix: com.umer9538
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

packages:
  Headroom:
    path: ../..

targets:
  HeadroomDemo:
    type: application
    platform: iOS
    sources:
      - path: HeadroomDemo
    dependencies:
      - package: Headroom
        product: Headroom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umer9538.headroomdemo
        PRODUCT_NAME: HeadroomDemo
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HeadroomDemo/Info.plist
        CODE_SIGN_STYLE: Automatic
    info:
      path: HeadroomDemo/Info.plist
      properties:
        CFBundleDisplayName: Headroom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]

schemes:
  HeadroomDemo:
    build:
      targets:
        HeadroomDemo: all
    run:
      # Release, so the C triad is compiled with optimisation and the phone's
      # CPU figure is a real ceiling rather than one flagged `unknown`.
      config: Release
    archive:
      config: Release
